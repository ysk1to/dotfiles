# -- general -------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
setw -g xterm-keys on
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on

set -g prefix C-q
unbind C-b
bind C-q send-prefix

set -g history-limit 50000

# 設定リロード
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf reloaded'

# fzf ポップアップ（どのペインからでも使える → 結果をクリップボードにコピー）
# C-q + R: 履歴検索（Ctrl+R 相当）
bind R display-popup -w 80% -h 80% -S fg=colour39 -E "zsh -i -c 'print -l \${(o)history} | fzf --tac --prompt=\"History> \" | tr -d \"\\n\" | pbcopy && tmux display-message \"Copied!\"'"
# C-q + T: ファイル検索（Ctrl+T 相当）
bind T display-popup -w 80% -h 80% -S fg=colour39 -E "zsh -c 'fzf --prompt=\"File> \" | tr -d \"\\n\" | pbcopy && tmux display-message \"Copied!\"'"
# C-q + F: ディレクトリ検索（Alt+C 相当）
bind F display-popup -w 80% -h 80% -S fg=colour39 -E "zsh -c 'find . -type d 2>/dev/null | fzf --prompt=\"Dir> \" | tr -d \"\\n\" | pbcopy && tmux display-message \"Copied!\"'"
# C-q + V: ファイルを選択して VSCode で開く
bind V display-popup -w 80% -h 80% -S fg=colour39 -E "zsh -c 'file=\$(fzf --prompt=\"VSCode> \") && open -a \"Visual Studio Code\" \"\$file\"'"


# -- display -------------------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles on

set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10

# ペインタイトル表示
set -g pane-border-status top
# ペイン番号はペイン移動（C-q q → 番号）で使う
# Claude Code の状態（tmux-claude-notify が記録）で番号・タイトル部分の背景色を変える
# 待機中（許可・入力待ち）=赤 / 完了=緑（ペインを選ぶと元の色に戻る）/ それ以外: 選択中=オレンジ・非選択=グレー
set -g @pane_label_bg "#{?#{==:#{@claude_state},waiting},colour160,#{?#{==:#{@claude_state},done},colour28,#{?pane_active,colour214,colour238}}}"
set -g @pane_label_fg "#{?#{@claude_state},colour255,#{?pane_active,colour235,colour250}}"
set -g pane-border-format "#[fg=#{E:@pane_label_fg} bg=#{E:@pane_label_bg}#{?pane_active, bold,}] #P │ #{pane_title} #[default]"
set-hook -g pane-focus-in 'if -F "#{==:#{@claude_state},done}" "set -p -u @claude_state"'


# activity
set -g monitor-activity on
set -g visual-activity off


# -- navigation ----------------------------------------------------------------

bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# ペイン分割（現在のパスを引き継ぐ）
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"

# ペイン移動（vi風）
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U

# ペインリサイズ
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# ウィンドウ移動
unbind n
unbind p
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# マウス
set -g mouse on


# -- copy mode -----------------------------------------------------------------

setw -g mode-keys vi
bind Enter copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

bind b list-buffers
bind p paste-buffer
bind P choose-buffer


# -- pane border ---------------------------------------------------------------

# 枠線もペイン番号・タイトル部分と同じく Claude Code の状態で色を変える（待機中=赤 / 完了=緑）
set -g pane-border-style '#{?#{==:#{@claude_state},waiting},fg=colour160,#{?#{==:#{@claude_state},done},fg=colour28,fg=colour238}}'
set -g pane-active-border-style '#{?#{==:#{@claude_state},waiting},fg=colour160,#{?#{==:#{@claude_state},done},fg=colour28,fg=colour214}}'


# -- plugins -------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# resurrect 設定
set -g @resurrect-capture-pane-contents 'on'

# continuum 設定（15分ごとに自動保存・自動復元）
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# battery アイコン
set -g @batt_icon_charge_tier8 '🌕'
set -g @batt_icon_charge_tier7 '🌖'
set -g @batt_icon_charge_tier6 '🌖'
set -g @batt_icon_charge_tier5 '🌗'
set -g @batt_icon_charge_tier4 '🌗'
set -g @batt_icon_charge_tier3 '🌘'
set -g @batt_icon_charge_tier2 '🌘'
set -g @batt_icon_charge_tier1 '🌑'
set -g @batt_icon_status_charged '🔋'
set -g @batt_icon_status_charging '⚡'
set -g @batt_icon_status_discharging '👎'

# online status アイコン
set -g @online_icon "📶"
set -g @offline_icon "📵"


# -- status bar ----------------------------------------------------------------

# 背景はターミナルの背景色（iTerm2 の濃紺・透け感）をそのまま使う
set -g status-style 'bg=terminal,fg=colour255'

# tmux-cpu カスタムカラー（低: 緑 / 中: オレンジ / 高: 赤）
set -g @cpu_low_bg_color "#[bg=colour22]"
set -g @cpu_low_fg_color "#[fg=colour255]"
set -g @cpu_medium_bg_color "#[bg=colour130]"
set -g @cpu_medium_fg_color "#[fg=colour255]"
set -g @cpu_high_bg_color "#[bg=colour124]"
set -g @cpu_high_fg_color "#[fg=colour255]"
set -g @ram_low_bg_color "#[bg=colour22]"
set -g @ram_low_fg_color "#[fg=colour255]"
set -g @ram_medium_bg_color "#[bg=colour130]"
set -g @ram_medium_fg_color "#[fg=colour255]"
set -g @ram_high_bg_color "#[bg=colour124]"
set -g @ram_high_fg_color "#[fg=colour255]"
set -g @cpu_temp_low_bg_color "#[bg=colour22]"
set -g @cpu_temp_low_fg_color "#[fg=colour255]"
set -g @cpu_temp_medium_bg_color "#[bg=colour130]"
set -g @cpu_temp_medium_fg_color "#[fg=colour255]"
set -g @cpu_temp_high_bg_color "#[bg=colour124]"
set -g @cpu_temp_high_fg_color "#[fg=colour255]"

# 左: モード表示と Claude Code の稼働数
# 通常=🚀（青）/ prefix 入力中=🔑 PREFIX（オレンジ）/ コピーモード=📋 COPY（黄）
set -g @mode_bg '#{?client_prefix,colour214,#{?pane_in_mode,colour221,colour69}}'
set -g status-left-length 50
set -g status-left "#[bg=#{E:@mode_bg},fg=colour235,bold] #{?client_prefix,🔑 PREFIX,#{?pane_in_mode,📋 COPY,🚀}} #[nobold]#(~/bin/tmux-claude-panes) #[fg=#{E:@mode_bg},bg=default] #[default]"

# 右: 天気・プラン使用率・監視（バッテリー/CPU/RAM）・時刻・日付
# セグメント色: 天気=colour238 / 使用率=colour240 / 監視=colour237 / 時刻=colour24 / 日付=colour31
set -g status-right-length 220
set -g status-right '#[fg=colour238,bg=default]#[fg=colour250,bg=colour238] #(~/bin/tmux-weather Chiba) #{online_status} #[fg=colour240,bg=colour238]#[fg=colour255,bg=colour240] 🤖 #(~/bin/tmux-claude-usage) #[fg=colour237,bg=colour240]#[fg=colour250,bg=colour237] #{battery_icon} #{battery_percentage} #{cpu_bg_color}#{cpu_fg_color} 💻 #{cpu_percentage}#[bg=colour237,fg=colour250] #{ram_bg_color}#{ram_fg_color} 💾 #{ram_percentage}#[bg=colour237,fg=colour250] #[fg=colour24,bg=colour237]#[fg=colour255,bg=colour24,bold] ⏰ %H:%M #[fg=colour31,bg=colour24]#[fg=colour255,bg=colour31,bold] 📅 %m/%d(%a) '

# ウィンドウリスト
# アイコン: 🤖 Claude Code / 📝 Vim / 🔐 ssh / 🐳 docker / 🐚 シェル / 🔧 その他
# フラグ:   🔍 ズーム中 / 🔔 ベル / 💬 アクティビティあり
# 番号の色: Claude Code が待機中のペインがあれば赤、完了したペインがあれば緑
set -g @win_icon '#{?#{==:#{pane_current_command},claude},🤖,#{?#{m:*vim*,#{pane_current_command}},📝,#{?#{==:#{pane_current_command},ssh},🔐,#{?#{m:docker*,#{pane_current_command}},🐳,#{?#{m:*sh,#{pane_current_command}},🐚,🔧}}}}}'
set -g @win_flags '#{?window_zoomed_flag, 🔍,}#{?window_bell_flag, 🔔,}#{?window_activity_flag, 💬,}'
set -g @win_index_fg '#{?#{P:#{?#{==:#{@claude_state},waiting},1,}},colour203,#{?#{P:#{?#{==:#{@claude_state},done},1,}},colour120,#{?window_active,colour119,colour250}}}'
set -g window-status-style fg='colour250',bg='default'
set -g window-status-current-style fg='colour214',bg='default',bold
set -g window-status-current-format '#[fg=colour239,bg=default]#[bg=colour239,fg=colour119,bold] #{E:@win_icon} #[fg=#{E:@win_index_fg}]#I#[fg=colour255]:#W#{E:@win_flags} #[fg=colour239,bg=default] '
set -g window-status-format ' #[fg=colour244]#{E:@win_icon} #[fg=#{E:@win_index_fg}]#I#[fg=colour237]:#[fg=colour252]#W#{E:@win_flags} '
set -g window-status-separator ''

# メッセージ
set -g message-style bg='colour235',fg='colour166'

# 時計
set-window-option -g clock-mode-colour colour64


# -- tpm (keep at bottom) ------------------------------------------------------

run '~/.tmux/plugins/tpm/tpm'
